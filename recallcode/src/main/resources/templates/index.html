
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>RecallCode | DSA Workspace</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
</head>
<body>
<div class="app-shell">
   
<header class="topbar">
    <a class="brand" th:href="@{/}">
        <span class="brand-icon">R</span>
        RecallCode
    </a>

    <div class="d-flex align-items-center gap-3">
        <span class="text-secondary small">DSA Practice Workspace</span>

        <!-- Securely logs out the currently authenticated user. -->
        <form th:action="@{/logout}" method="post" class="m-0">
            <input type="hidden"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}">

            <button type="submit" class="btn btn-outline-danger btn-sm">
                Logout
            </button>
        </form>
    </div>
</header>


    <main class="container-fluid dashboard-container">
        <!-- Row 1: Progress and Revision Queue -->
        <div th:replace="~{fragments/progress-revisions :: progressRevisions}"></div>

        <!-- Row 2: Problem selector and timer -->
        <div th:replace="~{fragments/practice-session :: practiceSession}"></div>

        <!-- Row 3: Library and attempt history -->
        <div th:replace="~{fragments/problem-library :: problemLibrary}"></div>

        
    </main>
</div>

<script th:src="@{/js/dashboard.js}"></script>
<script th:src="@{/js/timer.js}"></script>
<script th:src="@{/js/problem-library.js}"></script>
</body>
</html>
