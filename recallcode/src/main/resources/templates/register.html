<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>RecallCode | Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <style>
        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        .auth-card {
            width: 100%;
            max-width: 440px;
        }
        .auth-brand {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 2rem;
            text-decoration: none;
        }
    </style>
</head>
<body>
<div class="auth-container">
    <div class="auth-card">

        <a class="auth-brand brand" th:href="@{/register}">
            <span class="brand-icon">R</span>
            <span>RecallCode</span>
        </a>

        <div class="panel">
            <h1 class="panel-title mb-1" style="font-size:1.4rem">Create account</h1>
            <p class="text-secondary small mb-4">Start tracking your DSA practice.</p>

            <div id="registerMessage" role="alert" style="display:none;" class="alert py-2 small"></div>

            <form id="registerForm" novalidate>

                <div class="mb-3">
                    <label for="regUsername" class="form-label">Username</label>
                    <input id="regUsername"
                           name="username"
                           type="text"
                           class="form-control"
                           maxlength="100"
                           autocomplete="username"
                           required autofocus>
                </div>

                <div class="mb-3">
                    <label for="regEmail" class="form-label">Email</label>
                    <input id="regEmail"
                           name="email"
                           type="email"
                           class="form-control"
                           autocomplete="email"
                           required>
                </div>

                <div class="mb-3">
                    <label for="regPassword" class="form-label">Password</label>
                    <input id="regPassword"
                           name="password"
                           type="password"
                           class="form-control"
                           autocomplete="new-password"
                           minlength="8"
                           required>
                    <div class="form-text">At least 8 characters.</div>
                </div>

                <button id="registerSubmit" type="submit" class="btn btn-primary w-100 mt-2">
                    Create account
                </button>
            </form>

            <p class="text-center text-secondary small mt-3 mb-0">
                Already have an account?
                <a th:href="@{/login}">Sign in</a>
            </p>
        </div>

    </div>
</div>

<script>
    /**
     * Reads the XSRF-TOKEN cookie written by Spring Security's
     * CookieCsrfTokenRepository. The value must be sent as the
     * X-XSRF-TOKEN header on every state-changing fetch request.
     */
    function getCsrfToken() {
        const match = document.cookie.match(/(?:^|;\s*)XSRF-TOKEN=([^;]*)/);
        return match ? decodeURIComponent(match[1]) : '';
    }

    document.getElementById('registerForm').addEventListener('submit', async function (event) {
        event.preventDefault();

        const submitButton = document.getElementById('registerSubmit');
        const messageBox   = document.getElementById('registerMessage');

        submitButton.disabled = true;
        messageBox.style.display = 'none';
        messageBox.className = 'alert py-2 small';

        const username = document.getElementById('regUsername').value.trim();
        const email    = document.getElementById('regEmail').value.trim();
        const password = document.getElementById('regPassword').value;

        try {
            const response = await fetch('/api/auth/register', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-XSRF-TOKEN': getCsrfToken()
                },
                body: JSON.stringify({ username, email, password })
            });

            if (response.status === 201) {
                messageBox.classList.add('alert-success');
                messageBox.textContent = 'Account created! Redirecting to login…';
                messageBox.style.display = 'block';

                setTimeout(() => { window.location.href = '/login'; }, 1500);
                return;
            }

            // Handle validation errors (409) or unexpected failures.
            const data = await response.json().catch(() => ({}));
            messageBox.classList.add('alert-danger');
            messageBox.textContent = data.error || 'Registration failed. Please try again.';
            messageBox.style.display = 'block';

        } catch (error) {
            messageBox.classList.add('alert-danger');
            messageBox.textContent = 'Could not connect to the server. Please try again.';
            messageBox.style.display = 'block';
        } finally {
            submitButton.disabled = false;
        }
    });
</script>
</body>
</html>
