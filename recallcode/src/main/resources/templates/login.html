<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>RecallCode | Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <style>
        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        .auth-card {
            width: 100%;
            max-width: 420px;
        }
        .auth-brand {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 2rem;
            text-decoration: none;
        }
    </style>
</head>
<body>
<div class="auth-container">
    <div class="auth-card">

        <a class="auth-brand brand" th:href="@{/login}">
            <span class="brand-icon">R</span>
            <span>RecallCode</span>
        </a>

        <div class="panel">
            <h1 class="panel-title mb-1" style="font-size:1.4rem">Sign in</h1>
            <p class="text-secondary small mb-4">Welcome back. Enter your details to continue.</p>

            <!-- Error message from Spring Security -->
            <div th:if="${param.error}"
                 class="alert alert-danger py-2 small" role="alert">
                Incorrect username or password, or your account is inactive.
            </div>

            <!-- Logout confirmation -->
            <div th:if="${param.logout}"
                 class="alert alert-success py-2 small" role="alert">
                You have been signed out successfully.
            </div>

            <!--
                Spring Security processes POST /login.
                The _csrf hidden field is required — Thymeleaf injects the token automatically.
            -->
            <form th:action="@{/login}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                <div class="mb-3">
                    <label for="username" class="form-label">Username</label>
                    <input id="username"
                           name="username"
                           type="text"
                           class="form-control"
                           autocomplete="username"
                           required autofocus>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input id="password"
                           name="password"
                           type="password"
                           class="form-control"
                           autocomplete="current-password"
                           required>
                </div>

                <button type="submit" class="btn btn-primary w-100 mt-2">
                    Sign in
                </button>
            </form>

            <p class="text-center text-secondary small mt-3 mb-0">
                Don't have an account?
                <a th:href="@{/register}">Register</a>
            </p>
        </div>

    </div>
</div>
</body>
</html>
